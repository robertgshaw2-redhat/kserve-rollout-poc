apiVersion: serving.kserve.io/v1alpha2
kind: LLMInferenceService
metadata:
  name: gemma-4-downstream
spec:
  model:
    uri: hf://RedHatAI/gemma-4-12B-it-FP8-Dynamic
    name: RedHatAI/gemma-4-12B-it-FP8-Dynamic
  replicas: 2
  router:
    scheduler:
      template:
        imagePullSecrets:
          - name: rhai-pull-secret
        containers:
          - name: main
    route: { }
    gateway: { }
  template:
    imagePullSecrets:
      - name: rhai-pull-secret
    containers:
      - name: main
        image: quay.io/vllm/automation-vllm:0.24.0_rhaiv.12
        resources:
          limits:
            cpu: '8'
            memory: 16Gi
            nvidia.com/gpu: "1"
          requests:
            cpu: '8'
            memory: 16Gi
            nvidia.com/gpu: "1"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
            scheme: HTTPS
          initialDelaySeconds: 120
          periodSeconds: 30
          timeoutSeconds: 30
          failureThreshold: 5
